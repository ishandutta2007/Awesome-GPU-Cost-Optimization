    <circle cx="12" cy="12" r="3" fill="#2dd4bf" />
    <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2dd4bf" letter-spacing="0.5">FINOPS READY</text>
