<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f">
        <animate attributeName="stop-color" values="#1e1e2f;#2c2c54;#1e1e2f" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#24243e;#0f0c29" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" fill="url(#bg)" rx="15" />
  
  <g opacity="0.3">
    <!-- Animated background grid -->
    <path d="M0,50 L800,50 M0,100 L800,100 M0,150 L800,150" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" values="0;15" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M100,0 L100,200 M200,0 L200,200 M300,0 L300,200 M400,0 L400,200 M500,0 L500,200 M600,0 L600,200 M700,0 L700,200" stroke="#ffffff" stroke-width="0.5" />
  </g>

  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#glow)">
      <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title Text -->
  <text x="400" y="90" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Awesome GPU Cost Optimization
  </text>
  
  <!-- Subtitle Text -->
  <text x="400" y="130" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#4facfe" text-anchor="middle">
    Navigating AI Infrastructure Spend & FinOps
  </text>
</svg>
