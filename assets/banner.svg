    <circle cx="12" cy="12" r="3" fill="#a5b4fc" />
    <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">FOCUS 1.0 COMPLIANT</text>
  </g>
