        <rect width="222" height="34" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
        <circle cx="14" cy="17" r="3.5" fill="#38bdf8" />
        <text x="26" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">Auto-Scaled: <tspan fill="#38bdf8" font-weight="700">Spot &amp; Fractional GPUs</tspan></text>
