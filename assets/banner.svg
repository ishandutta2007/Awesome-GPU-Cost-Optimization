      <text x="16" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#34d399">ACTIVE</text>
    </g>

    <!-- Left Column: GPU Silicon Processor Die -->
