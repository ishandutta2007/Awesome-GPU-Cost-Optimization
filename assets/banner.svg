<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="glow-cyan" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-emerald" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-indigo" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Silicon Core Gradient -->
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dot-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Card Background with Rounded Corners -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#glow-cyan)" />
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#glow-emerald)" />
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#glow-indigo)" />

  <!-- Background Patterns -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#grid-pattern)" />
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#dot-pattern)" />

  <!-- Subtle Circuit Line Traces in Background -->
  <g opacity="0.35" stroke="#0ea5e9" stroke-width="1" fill="none">
    <path d="M 0 100 L 120 100 L 160 140 L 220 140" />
    <circle cx="220" cy="140" r="2.5" fill="#38bdf8" />
    <path d="M 40 338 L 80 298 L 180 298" />
    <circle cx="180" cy="298" r="2" fill="#38bdf8" />
    <path d="M 1198 220 L 1140 220 L 1100 180" />
    <circle cx="1100" cy="180" r="2.5" fill="#34d399" />
  </g>

  <!-- ================= LEFT / HERO TEXT SECTION ================= -->

  <!-- Category Tag / Badge -->
  <g transform="translate(60, 38)">
    <rect width="280" height="28" rx="14" fill="#082f49" fill-opacity="0.85" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">⚡ CURATED FINOPS &amp; AI INFRA ECOSYSTEM</text>
  </g>

  <!-- Main Repository Title -->
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Awesome GPU Cost Optimization</text>

  <!-- Subtitle -->
  <text x="60" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8">Cloud Spend Visibility • Kubernetes Allocation • Rightsizing • AI Infrastructure FinOps</text>

  <!-- Feature Chips / Tags - Row 1 -->
  <g transform="translate(60, 174)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="168" height="32" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="12" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">☁️ SaaS GPU Clouds</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(178, 0)">
      <rect width="188" height="32" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="12" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">☸️ Kubernetes FinOps</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(376, 0)">
      <rect width="190" height="32" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="12" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📉 Workload Rightsizing</text>
    </g>
  </g>

  <!-- Feature Chips / Tags - Row 2 -->
  <g transform="translate(60, 216)">
    <!-- Chip 4 -->
    <g transform="translate(0, 0)">
      <rect width="198" height="32" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="12" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Real-Time Telemetry</text>
    </g>

    <!-- Chip 5 -->
    <g transform="translate(208, 0)">
      <rect width="186" height="32" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="12" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">💰 FOCUS Specification</text>
    </g>

    <!-- Chip 6 -->
    <g transform="translate(404, 0)">
      <rect width="162" height="32" rx="7" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="12" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🚀 Open-Source Hub</text>
    </g>
  </g>

  <!-- Footer Metadata Bar -->
  <g transform="translate(60, 282)">
    <circle cx="6" cy="6" r="4" fill="#10b981" />
    <circle cx="6" cy="6" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4" />
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Built for Platform Engineers, FinOps Practitioners &amp; MLOps Teams</text>
  </g>

  <!-- ================= RIGHT / GPU & TELEMETRY DASHBOARD ================= -->

  <!-- Top Floating Badge -->
  <g transform="translate(710, 28)">
