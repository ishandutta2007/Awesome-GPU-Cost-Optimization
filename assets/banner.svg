      <!-- Outer Die Package -->
      <rect width="144" height="178" rx="10" fill="#090e1a" stroke="#0284c7" stroke-width="1.2" />

      <!-- Top HBM Memory Modules -->
      <rect x="24" y="10" width="42" height="16" rx="2" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />
      <rect x="78" y="10" width="42" height="16" rx="2" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="45" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">HBM3</text>
      <text x="99" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">HBM3</text>

      <!-- Bottom HBM Memory Modules -->
      <rect x="24" y="152" width="42" height="16" rx="2" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />
      <rect x="78" y="152" width="42" height="16" rx="2" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="45" y="163.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">HBM3</text>
      <text x="99" y="163.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">HBM3</text>

      <!-- Left / Right Memory Modules -->
      <rect x="8" y="44" width="14" height="40" rx="2" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />
      <rect x="8" y="94" width="14" height="40" rx="2" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />
      <rect x="122" y="44" width="14" height="40" rx="2" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />
      <rect x="122" y="94" width="14" height="40" rx="2" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" />

      <!-- Center AI Compute Die -->
      <rect x="30" y="36" width="84" height="106" rx="6" fill="url(#core-grad)" stroke="#38bdf8" stroke-width="1.2" />

      <!-- Micro-circuit patterns inside die -->
      <g stroke="#38bdf8" stroke-width="0.5" opacity="0.4" fill="none">
        <path d="M 40 46 L 60 46 L 60 60" />
        <path d="M 104 46 L 84 46 L 84 60" />
        <path d="M 40 132 L 60 132 L 60 118" />
        <path d="M 104 132 L 84 132 L 84 118" />
      </g>

      <!-- Center Die Labels -->
      <text x="72" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AI CORE</text>
      <text x="72" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">98.4% UTIL</text>
      <rect x="44" y="104" width="56" height="18" rx="3" fill="#0369a1" fill-opacity="0.5" stroke="#38bdf8" stroke-width="0.6" />
      <text x="72" y="116.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">OPTIMIZED</text>
    </g>

    <!-- Right Column: FinOps Metrics & Cost Optimization Curve -->
    <g transform="translate(180, 50)">
      <!-- Metric: Spend Reduction -->
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">MONTHLY SPEND REDUCTION</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#10b981">-58.4%</text>
      <text x="96" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#34d399">($18,400/mo)</text>

      <!-- Sparkline Cost Chart Container -->
      <g transform="translate(0, 50)">
        <rect width="222" height="74" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1" />
        
        <!-- Chart Grid Lines -->
        <line x1="8" y1="24" x2="214" y2="24" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="0.8" />
        <line x1="8" y1="48" x2="214" y2="48" stroke="#1e293b" stroke-dasharray="3,3" stroke-width="0.8" />

        <!-- Downward Cost Reduction Curve -->
        <path d="M 12 20 C 40 18, 70 38, 100 32 C 130 26, 160 54, 210 52 L 210 70 L 12 70 Z" fill="url(#chart-grad)" />
        <path d="M 12 20 C 40 18, 70 38, 100 32 C 130 26, 160 54, 210 52" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" />

        <!-- Target Data Point Marker -->
        <circle cx="210" cy="52" r="3.5" fill="#10b981" />
        <circle cx="210" cy="52" r="6.5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
      </g>

      <!-- Auto-Scaling Status Badge -->
